name: Release

on:
  workflow_run:
    workflows: [Windows]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  draft-release:
    name: Draft release

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Windows and Linux
        uses: ahmadnassri/action-workflow-run-wait@v1

      - name: Windows artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: windows.yml
          workflow_conclusion: success

          commit: ${{ github.event.workflow_run.head_sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Linux artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: linux.yml
          workflow_conclusion: success

          commit: ${{ github.event.workflow_run.head_sha }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts

      - name: Artifacts
        run: find artifacts -maxdepth 2 -type f | sort

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "#${{ github.event.workflow_run.run_number }}"
          name: "#${{ github.event.workflow_run.run_number }}"
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/build-windows-installer/Schedule-windows-installer.exe
            artifacts/build-windows-portable/Schedule-windows-portable.zip
            artifacts/build-linux-portable/Schedule-linux-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
