name: Release

on:
  workflow_run:
    workflows: ["Compile"]
    types:
      - completed

permissions:
  contents: write

jobs:
  create-draft-release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "#${{ github.event.workflow_run.run_number }}"
          name: "#${{ github.event.workflow_run.run_number }}"
          draft: true
          generate_release_notes: true
          files: |
            artifacts/Schedule-windows-installer.exe
            artifacts/Schedule-windows-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
