name: Build

on: push

permissions:
  contents: write

env:
  TAG: "#${{ github.run_number }}"

defaults:
  run:
    shell: bash

jobs:
  build-windows-python:
    name: Windows Python

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          New-Item -ItemType Directory -Path "windows" -Force | Out-Null
          Copy-Item -Path "$env:pythonLocation\*" -Destination "windows" -Recurse -Force

          & "windows\python.exe" -m pip install --upgrade pip
          & "windows\python.exe" -m pip install -r requirements.txt --no-warn-script-location

          Get-ChildItem -Path "windows" -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          if (Test-Path "windows\Lib\test") { Remove-Item "windows\Lib\test" -Recurse -Force }

      - name: Copy qt plugins
        run: |
          $base = "windows\Lib\site-packages\PyQt5\Qt5\plugins"

          foreach ($name in @("platforms", "styles", "imageformats", "iconengines")) {
            if (Test-Path "$base\$name") {
              New-Item -ItemType Directory -Path "windows\$name" -Force | Out-Null
              Copy-Item -Path "$base\$name\*" -Destination "windows\$name" -Recurse -Force
            }
          }

          foreach ($f in @("platforms\qwindows.dll", "imageformats\qsvg.dll", "iconengines\qsvgicon.dll")) {
            if (-not (Test-Path "windows\$f")) {
              throw "$f not found!"
            }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-windows
          path: windows

  build-windows-installer:
    name: Windows Installer

    needs: build-windows-python
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download python
        uses: actions/download-artifact@v7
        with:
          name: python-windows
          path: python

      - name: Build solver
        run: ./compile.bat

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: .github/compile/compile.iss
          options: /Q /O+

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-windows-installer
          path: .github/out/Schedule-windows-installer.exe

  build-windows-portable:
    name: Windows Portable

    needs: build-windows-python
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download python
        uses: actions/download-artifact@v7
        with:
          name: python-windows
          path: python

      - name: Build solver
        run: ./compile.bat

      - name: Assemble portable
        run: |
          $dst = "portable/Schedule"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          $files = @(
            "Schedule.exe", "Schedule.py", "start.py", "requirements.txt", "README.md",
            "profile.bat", "LICENSE", "compile.bat", "Schedule.sh", "compile.sh"
          )
          foreach ($f in $files) {
            Copy-Item -Path $f -Destination $dst -Force
          }

          foreach ($d in @("last", "src", "python")) {
            Copy-Item -Path $d -Destination "$dst/$d" -Recurse -Force
          }

      - name: Create archive
        run: |
          New-Item -ItemType Directory -Path ".github/out" -Force | Out-Null
          Compress-Archive -Path "portable/Schedule" -DestinationPath ".github/out/Schedule-windows-portable.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-windows-portable
          path: .github/out/Schedule-windows-portable.zip

  build-linux-python:
    name: Linux Python

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo astral-sh/python-build-standalone \
            --pattern 'cpython-3.11.*-x86_64-unknown-linux-gnu-install_only.tar.gz' --dir /tmp
          tar -xzf /tmp/cpython-3.11.*-install_only.tar.gz -C .
          mv python linux

      - name: Install requirements
        run: |
          linux/bin/python3 -m pip install --upgrade pip
          linux/bin/python3 -m pip install -r requirements.txt

          rm -rf linux/lib/python3.11/test

      - name: Check qt plugins
        run: |
          base="linux/lib/python3.11/site-packages/PyQt5/Qt5/plugins"
          for f in platforms/libqxcb.so imageformats/libqsvg.so iconengines/libqsvgicon.so; do
            if [ ! -f "$base/$f" ]; then
              echo "::error::$f not found!"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: python-linux
          path: linux

  build-linux-portable:
    name: Linux Portable

    needs: build-linux-python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download python
        uses: actions/download-artifact@v7
        with:
          name: python-linux
          path: python

      - name: Build solver
        run: bash ./compile.sh

      - name: Assemble portable
        run: |
          dst="portable/Schedule"
          mkdir -p "$dst"

          cp Schedule.exe Schedule.py start.py requirements.txt README.md profile.bat LICENSE compile.bat Schedule.sh compile.sh "$dst/"
          cp -r last src python "$dst/"

          chmod +x "$dst/Schedule.sh" "$dst/python/bin/"*

      - name: Create archive
        run: |
          mkdir -p .github/out
          tar -czf .github/out/Schedule-linux-portable.tar.gz -C portable Schedule

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-linux-portable
          path: .github/out/Schedule-linux-portable.tar.gz

  build-linux-executable:
    name: Linux Executable

    needs: build-linux-python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download python
        uses: actions/download-artifact@v7
        with:
          name: python-linux
          path: python

      - name: Build solver
        run: bash ./compile.sh

      - name: Assemble dir
        run: |
          dst="AppDir/opt/Schedule"
          mkdir -p "$dst"

          cp Schedule.exe Schedule.py start.py requirements.txt README.md profile.bat LICENSE compile.bat Schedule.sh compile.sh "$dst/"
          cp -r last src python "$dst/"

          chmod +x "$dst/Schedule.sh" "$dst/python/bin/"* "$dst/src/modules/solve"

      - name: Prepare dir
        run: |
          dst="AppDir/opt/Schedule"

          echo "$GITHUB_RUN_NUMBER" > AppDir/version

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          SRC="$HERE/opt/Schedule"
          DATA="${XDG_DATA_HOME:-$HOME/.local/share}/Schedule"
          VER="$(cat "$HERE/version")"

          if [ "$(cat "$DATA/.version" 2>/dev/null)" != "$VER" ]; then
            mkdir -p "$DATA"
            for item in "$SRC"/*; do
              name="$(basename "$item")"
              [ "$name" = python ] && continue
              [ "$name" = last ] && [ -d "$DATA/last" ] && continue
              rm -rf "$DATA/$name"
              cp -a "$item" "$DATA/$name"
            done
            echo "$VER" > "$DATA/.version"
          fi

          ln -sfn "$SRC/python" "$DATA/python"

          cd "$DATA"
          export PYTHONDONTWRITEBYTECODE=1
          exec "$DATA/python/bin/python3" "$DATA/start.py" "$@"
          EOF

          cat > AppDir/schedule.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Schedule
          Exec=AppRun
          Icon=schedule
          Categories=Office;
          Terminal=false
          EOF

          cp "$dst/src/files/sprites/icon.ico" AppDir/schedule.png

          chmod +x AppDir/AppRun

      - name: Build executable
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

          mkdir -p .github/out
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            AppDir .github/out/Schedule-linux-executable.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: build-linux-executable
          path: .github/out/Schedule-linux-executable.AppImage

  smoke-windows-portable:
    name: Smoke Windows Portable

    needs: build-windows-portable
    runs-on: windows-latest

    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout .github
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Download portable
        uses: actions/download-artifact@v7
        with:
          name: build-windows-portable
          path: dist

      - name: Smoke test
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Test"
          Expand-Archive "dist\Schedule-windows-portable.zip" -DestinationPath $dir -Force

          $pkg = Join-Path $dir "Schedule"
          & "$pkg\python\python.exe" ".github\smoke.py" $pkg --seconds 15
          if ($LASTEXITCODE) { throw "Smoke test failed (code $LASTEXITCODE)" }

  smoke-windows-installer:
    name: Smoke Windows Installer

    needs: build-windows-installer
    runs-on: windows-latest

    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout .github
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Download installer
        uses: actions/download-artifact@v7
        with:
          name: build-windows-installer
          path: dist

      - name: Install
        timeout-minutes: 5
        run: |
          $installer = (Resolve-Path "dist\Schedule-windows-installer.exe").Path
          $dir = Join-Path $env:RUNNER_TEMP "Test"
          $log = Join-Path $env:RUNNER_TEMP "install.log"

          $p = Start-Process $installer -Wait -PassThru -ArgumentList @(
            "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-",
            "/DIR=`"$dir`"", "/LOG=`"$log`""
          )

          if ($p.ExitCode -ne 0) {
            Get-Content $log -Tail 50
            throw "Installer exited with code $($p.ExitCode)"
          }

          if (-not (Test-Path "$dir\python\python.exe")) {
            Get-Content $log -Tail 50
            throw "python.exe not found after install: $dir\python\python.exe"
          }

      - name: Smoke test
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Test"
          $env:PYTHONDONTWRITEBYTECODE = "1"

          & "$dir\python\python.exe" ".github\smoke.py" $dir --seconds 15
          if ($LASTEXITCODE) { throw "Smoke test failed (code $LASTEXITCODE)" }

      - name: Uninstall
        if: always()
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Test"
          $uninstaller = "$dir\unins000.exe"

          if (-not (Test-Path $uninstaller)) { throw "unins000.exe not found: installation is broken" }

          Start-Process $uninstaller -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"

          $tracked = @("Schedule.exe", "Schedule.py", "start.py", "unins000.exe")
          for ($i = 0; $i -lt 60; $i++) {
            $left = $tracked | Where-Object { Test-Path (Join-Path $dir $_) }
            if (-not $left) { break }
            Start-Sleep 1
          }

          if ($left) { throw "Files were not removed after uninstall: $($left -join ', ')" }

          if (Test-Path $dir) {
            $rest = @(Get-ChildItem $dir -Recurse -File -ErrorAction SilentlyContinue)
            Write-Host "::warning::Folder still exists, $($rest.Count) untracked files left (created at runtime)"
          }

  smoke-linux-portable:
    name: Smoke Linux Portable

    needs: build-linux-portable
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout .github
        uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Download portable
        uses: actions/download-artifact@v7
        with:
          name: build-linux-portable
          path: dist

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0

      - name: Smoke test
        run: |
          dir="$RUNNER_TEMP/Test"
          mkdir -p "$dir"
          tar -xzf dist/Schedule-linux-portable.tar.gz -C "$dir"

          pkg="$dir/Schedule"
          xvfb-run -a "$pkg/python/bin/python3" .github/smoke.py "$pkg" --seconds 15

  smoke-linux-executable:
    name: Smoke Linux Executable

    needs: build-linux-executable
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Download executable
        uses: actions/download-artifact@v7
        with:
          name: build-linux-executable
          path: dist

      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0

      - name: Smoke test
        run: |
          export XDG_DATA_HOME="$RUNNER_TEMP/Data"
          export APPIMAGE_EXTRACT_AND_RUN=1
          
          app="$PWD/dist/Schedule-linux-executable.AppImage"
          data="$XDG_DATA_HOME/Schedule"
          
          chmod +x "$app"
          
          code=0
          timeout 20 xvfb-run -a "$app" || code=$?
          
          if [ "$code" -ne 124 ]; then
            echo "::error::AppImage exited before the timeout (code $code)"
            exit 1
          fi
          
          for f in start.py Schedule.py src .version; do
            if [ ! -e "$data/$f" ]; then
              echo "::error::$f not found in $data"
              exit 1
            fi
          done
          
          if [ "$(cat "$data/.version")" != "$GITHUB_RUN_NUMBER" ]; then
            echo "::error::Wrong version in $data/.version: $(cat "$data/.version")"
            exit 1
          fi

  release:
    name: Release

    needs:
      - smoke-windows-installer
      - smoke-windows-portable
      - smoke-linux-portable
      - smoke-linux-executable
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/Schedule-windows-installer.exe
            artifacts/Schedule-windows-portable.zip
            artifacts/Schedule-linux-portable.tar.gz
            artifacts/Schedule-linux-executable.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Server

    needs: release
    runs-on: ubuntu-latest

    env:
      URL: ${{ secrets.UPLOAD_SITE_URL }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: build-*
          path: artifacts

          merge-multiple: true

      - name: Check artifacts
        run: |
          ls -lh artifacts
          
          test -n "$(ls -A artifacts)"

      - name: Upload to server
        run: |
          dir="${TAG//#/}"
          api() { curl -fsS "$@"; }
          post() { jq -nc --arg p "$2" '{path: $p}' | api -H 'Content-Type: application/json' -d @- "$URL/api/$1"; }

          api -H 'Content-Type: application/json' -d '{"path":"","name":"Schedule"}' "$URL/api/mkdir" || true
          post delete "Schedule/$dir" || true
          api -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg n "$dir" '{path: "Schedule", name: $n}')" "$URL/api/mkdir"

          for f in artifacts/*; do
            echo "Uploading $f"
            api -F "path=Schedule/$dir" -F "files=@$f" "$URL/api/upload"
            echo
          done

          api "$URL/api/list?path=Schedule/$dir" | jq -r '.items[] | "\(.size)\t\(.name)"'

          api --get --data-urlencode "path=Schedule" "$URL/api/list" \
            | jq -r '.items[] | select(.is_dir) | .name' \
            | sort -V \
            | head -n -99 \
            | { grep -vxF "$dir" || true; } \
            | while read -r d; do
                [ -z "$d" ] && continue
                post delete "Schedule/$d"
                echo
              done
