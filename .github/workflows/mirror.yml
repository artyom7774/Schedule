name: Mirror

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  cancel-in-progress: false
  group: gdrive-upload

jobs:
  mirror:
    name: Mirror

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Find release
        id: rel
        run: |
          release="$(GH_TOKEN='${{ github.token }}' gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0]')"

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "No release found" >&2
            exit 1
          fi

          echo "tag=$(echo "$release" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"
          echo "$release" | jq -r '.assets[] | "\(.id) \(.name)"' > assets.txt

      - name: Download release
        run: |
          mkdir -p artifacts
          while read -r id name; do
            [ -z "$id" ] && continue
            GH_TOKEN='${{ github.token }}' gh api \
              -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$id" \
              > "artifacts/$name"
          done < assets.txt

          ls -lh artifacts
          test -n "$(ls -A artifacts)"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to Google Drive
        env:
          RCLONE_CONFIG_GDRIVE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GDRIVE_SA_JSON }}
          RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}

          RCLONE_CONFIG_GDRIVE_SCOPE: drive
          RCLONE_CONFIG_GDRIVE_TYPE: drive

        run: |
          rclone copy artifacts "gdrive:${{ steps.rel.outputs.tag }}" --progress
          rclone ls "gdrive:${{ steps.rel.outputs.tag }}"
