name: Compile

on: push

jobs:
  build-windows-installer:
    name: Windows Installer

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Include python
        uses: actions/checkout@v4
        with:
          repository: artyom7774/Schedule-python
          path: python

      - name: Copy python to project
        run: |
          Copy-Item -Path "python/windows" -Destination "." -Recurse -Force
        shell: pwsh

      - name: Windows compile
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.7
        with:
          path: .github/compile/compile.iss
          options: /Q /O+

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-windows-installer
          path: .github/out/Schedule-windows-installer.exe

  build-windows-portable:
    name: Windows Portable

    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Include python
        uses: actions/checkout@v4
        with:
          repository: artyom7774/Schedule-python
          path: python

      - name: Copy python to project
        run: |
          Copy-Item -Path "python/windows" -Destination "." -Recurse -Force
        shell: pwsh

      - name: Windows portable
        run: |
          $dst = "portable/Schedule"

          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          Copy-Item -Path "Schedule.exe"      -Destination $dst -Force
          Copy-Item -Path "Schedule.py"       -Destination $dst -Force
          Copy-Item -Path "start.py"          -Destination $dst -Force
          Copy-Item -Path "requirements.txt"  -Destination $dst -Force
          Copy-Item -Path "README.md"         -Destination $dst -Force
          Copy-Item -Path "profile.bat"       -Destination $dst -Force
          Copy-Item -Path "LICENSE"           -Destination $dst -Force
          Copy-Item -Path "compile.bat"       -Destination $dst -Force

          Copy-Item -Path "last"    -Destination "$dst/last"   -Recurse -Force
          Copy-Item -Path "src"     -Destination "$dst/src"    -Recurse -Force
          Copy-Item -Path "windows" -Destination "$dst/python" -Recurse -Force
        shell: pwsh

      - name: Create zip archive
        run: |
          New-Item -ItemType Directory -Path ".github/out" -Force | Out-Null
          Compress-Archive -Path "portable/Schedule" -DestinationPath ".github/out/Schedule-windows-portable.zip" -Force
        shell: pwsh

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Schedule-windows-portable
          path: .github/out/Schedule-windows-portable.zip
