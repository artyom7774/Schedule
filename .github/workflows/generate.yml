name: Generate

on:
  workflow_dispatch:
    inputs:
      runs:
        default: "10"

      iterations:
        default: "1000"

      seed:
        default: "0"

jobs:
  generate:
    name: Generate

    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Install build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build solver
        run: |
          g++ -std=c++17 -O3 src/modules/solve.cpp -o src/modules/solve
          
          chmod +x src/modules/solve
          
          ls -la src/modules/solve

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install numpy

      - name: Check solver
        run: |
          ./src/modules/solve --help | head -30 || true

      - name: Run worker
        run: |
          python tuner/worker.py \
            --runs       "${{ inputs.runs }}" \
            --iterations "${{ inputs.iterations }}" \
            --seed       "${{ inputs.seed }}" \
            --workers    "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: pool-run${{ github.run_number }}
          path: tuner/pool/
