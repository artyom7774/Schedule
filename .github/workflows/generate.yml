name: Generate

on:
  workflow_dispatch:
    inputs:
      runs:
        default: "100"
      iterations:
        default: "100000000"
      seed:
        default: "0"
      shards:
        default: "4"

jobs:
  prepare:
    name: Prepare matrix

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - id: set
        run: |
          N=${{ inputs.shards }}
          echo "matrix=$(python3 -c "import json;print(json.dumps({'shard': list(range($N))}))")" >> $GITHUB_OUTPUT

  generate:
    name: Process ${{ matrix.shard }}
    needs: prepare

    runs-on: ubuntu-latest

    timeout-minutes: 300

    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Install build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build solver
        run: |
          g++ -std=c++17 -O3 src/modules/solve.cpp -o src/modules/solve
          
          chmod +x src/modules/solve
          
          ls -la src/modules/solve

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install numpy

      - name: Check solver
        run: ./src/modules/solve --help | head -30 || true

      - name: Run worker (shard ${{ matrix.shard }}/${{ inputs.shards }})
        run: |
          python tuner/worker.py --runs "${{ inputs.runs }}" --iterations "${{ inputs.iterations }}" --seed "${{ inputs.seed }}" --shard ${{ matrix.shard }} --shards ${{ inputs.shards }} --workers "$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: process - ${{ matrix.shard }}
          path: tuner/pool/

  merge:
    name: Merge shards
    needs: generate

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: process - *
          merge-multiple: false
          path: shards

      - name: Combine manifests and dirs
        run: |
          python3 - <<'EOF'
          import csv, pathlib, shutil, sys

          shards_root = pathlib.Path('shards')
          out = pathlib.Path('pool')
          out.mkdir(exist_ok=True)

          manifest_rows = []
          fields = None
          shard_count = 0

          for shard_dir in sorted(shards_root.iterdir()):
              if not shard_dir.is_dir():
                  continue

              pool = shard_dir / 'tuner' / 'pool'
              if not pool.exists():
                  pool = shard_dir

              shard_count += 1
              print(f'{shard_dir.name}: from {pool}')

              for item in pool.iterdir():
                  if item.is_dir():
                      target = out / item.name
                      if target.exists():
                          sys.exit(f'COLLISION: {item.name} already exists in another shard')
                      shutil.copytree(item, target)

              manifest = pool / 'manifest.csv'
              if manifest.exists():
                  with open(manifest, encoding='utf-8') as f:
                      reader = csv.DictReader(f)
                      if fields is None:
                          fields = reader.fieldnames
                      manifest_rows.extend(reader)

          if not manifest_rows:
              sys.exit('no manifest rows found')

          with open(out / 'manifest.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.DictWriter(f, fieldnames=fields)
              w.writeheader()
              w.writerows(manifest_rows)

          print()
          print(f'shards merged: {shard_count}')
          print(f'total runs:    {len(manifest_rows)}')
          print(f'manifest:      {out / "manifest.csv"}')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: output
          path: pool/
