name: Generate

on:
  workflow_dispatch:
    inputs:
      runs:
        default: "100"

      iterations:
        default: "100000000"

      seed:
        default: "0"

      shards:
        default: "4"

jobs:
  prepare:
    name: Prepare matrix

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.set.outputs.matrix }}

    steps:
      - id: set
        run: |
          N=${{ inputs.shards }}
          echo "matrix=$(python3 -c "import json; print(json.dumps({'include': [{'shard': i, 'part': i+1} for i in range($N)]}))")" >> $GITHUB_OUTPUT

  generate:
    name: Process ${{ matrix.shard }}
    needs: prepare

    runs-on: ubuntu-latest

    timeout-minutes: 300

    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - name: Install build
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build solver
        run: |
          g++ -std=c++17 -O3 src/modules/solve.cpp -o src/modules/solve
          
          chmod +x src/modules/solve
          
          ls -la src/modules/solve

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requirements
        run: pip install numpy

      - name: Check solver
        run: ./src/modules/solve --help | head -30 || true

      - name: Run worker (shard ${{ matrix.part }}/${{ inputs.shards }})
        run: |
          python tuner/worker.py --runs "${{ inputs.runs }}" --iterations "${{ inputs.iterations }}" --seed "${{ inputs.seed }}" --shard ${{ matrix.shard }} --shards ${{ inputs.shards }} --workers "$(nproc)"

      - uses: actions/upload-artifact@v6
        with:
          name: process - ${{ matrix.part }}
          path: tuner/pool/

  merge:
    name: Merge processes
    needs: generate

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: process - *
          merge-multiple: false
          path: shards

      - name: Combine manifests and dirs
        run: |
          python3 - <<'EOF'
          import csv, pathlib, shutil, sys

          shards = pathlib.Path('shards')
          
          out = pathlib.Path('pool')
          out.mkdir(exist_ok=True)

          rows = []
          
          fields = None
          count = 0

          for dir in sorted(shards.iterdir()):
              if not dir.is_dir():
                  continue

              pool = dir / 'tuner' / 'pool'
          
              if not pool.exists():
                  pool = dir

              count += 1
          
              print(f'{dir.name}: from {pool}')

              for item in pool.iterdir():
                  if item.is_dir():
                      shutil.copytree(item, out / item.name)

              manifest = pool / 'manifest.csv'
          
              if manifest.exists():
                  with open(manifest, encoding='utf-8') as f:
                      reader = csv.DictReader(f)
          
                      if fields is None:
                          fields = reader.fieldnames
          
                      rows.extend(reader)

          with open(out / 'manifest.csv', 'w', newline='', encoding='utf-8') as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: output
          path: pool/
