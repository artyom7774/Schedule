name: Mirror

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: write

concurrency:
  cancel-in-progress: false
  group: yandex

jobs:
  mirror:
    name: Mirror

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Find release
        id: rel
        run: |
          release="$(GH_TOKEN='${{ github.token }}' gh api "repos/${{ github.repository }}/releases?per_page=1" --jq '.[0]')"

          if [ -z "$release" ] || [ "$release" = "null" ]; then
            echo "No release found" >&2
            exit 1
          fi

          echo "tag=$(echo "$release" | jq -r '.tag_name')" >> "$GITHUB_OUTPUT"
          echo "$release" | jq -r '.assets[] | "\(.id) \(.name)"' > assets.txt

      - name: Download release
        run: |
          mkdir -p artifacts
          while read -r id name; do
            [ -z "$id" ] && continue
            GH_TOKEN='${{ github.token }}' gh api \
              -H "Accept: application/octet-stream" \
              "repos/${{ github.repository }}/releases/assets/$id" \
              > "artifacts/$name"
          done < assets.txt

          ls -lh artifacts
          test -n "$(ls -A artifacts)"

      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Upload to Yandex Disk
        env:
          TAG: ${{ steps.rel.outputs.tag }}

          RCLONE_CONFIG_SCHEDULE_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          RCLONE_CONFIG_SCHEDULE_HARD_DELETE: "true"
          RCLONE_CONFIG_SCHEDULE_TYPE: yandex
        run: |
          dir="${TAG//#/}"
          
          rclone copy artifacts "schedule:Schedule/$dir" --progress
          rclone ls "schedule:Schedule/$dir"
          
          rclone lsf --dirs-only "schedule:Schedule" \
            | sed 's#/$##' \
            | sort -V \
            | head -n -5 \
            | { grep -vxF "$dir" || true; } \
            | while read -r d; do
                [ -z "$d" ] && continue
                rclone purge "schedule:Schedule/$d"
              done
