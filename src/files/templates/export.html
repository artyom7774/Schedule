<!DOCTYPE html>
<html lang="$LANGUAGE$">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            --bg:            #f4f6f9;
            --surface:       #ffffff;
            --border:        #e6eaf0;
            --border-soft:   #e1e5ea;
            --text:          #2c3e50;
            --text-strong:   #1a2233;
            --muted:         #6b7a90;
            --accent:        #4a7dff;
            --accent-soft:   #eef3ff;
            --accent-border: #d6e2ff;
            --shadow:        0 2px 10px rgba(30, 50, 90, 0.05);
            --radius:        12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-soft);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header {
            width: 100%;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header__logo {
            font-weight: 700;
            font-size: 1.25rem;
            color: var(--text);
            padding: 14px 0;
            letter-spacing: 0.5px;
        }

        .header__logo span {
            color: var(--accent);
        }

        footer {
            background: var(--surface);
            color: var(--muted);
            padding: 32px 24px;
            margin-top: auto;
            border-top: 1px solid var(--border-soft);
        }

        .footer {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 0.9rem;
        }

        .footer__links {
            display: flex;
            gap: 22px;
            flex-wrap: wrap;
        }

        .footer__links a {
            color: var(--muted);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer__links a:hover {
            color: var(--text);
        }

        main {
            flex: 1;
            width: 100%;
            padding: 24px 24px 64px;
        }

        .main__title {
            font-size: 2.4rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text-strong);
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .main__subtitle {
            font-size: 1.4rem;
            line-height: 1.5;
            color: var(--muted);
            margin-bottom: 40px;
            max-width: 800px;
            padding-left: 5px;
        }

        .layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            align-items: start;
        }

        .left-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 24px;
            box-shadow: var(--shadow);
        }

        .panel h3 {
            margin: 0 0 14px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .main-tab {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .main-tab:last-child {
            margin-bottom: 0;
        }

        .main-tab:hover {
            background: #eef2f7;
        }

        .main-tab.active {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
            font-weight: 600;
        }

        .sub-item {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            text-align: left;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--text);
            background: var(--bg);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .sub-item:last-child {
            margin-bottom: 0;
        }

        .sub-item:hover {
            background: #eef2f7;
        }

        .sub-item.active {
            background: var(--accent-soft);
            border-color: var(--accent-border);
            color: var(--accent);
            font-weight: 600;
        }

        .sub-item .idx {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--muted);
            transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .sub-item.active .idx {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }

        #tableArea {
            padding: 26px 28px;
        }

        #tableArea h3 {
            margin: 0 0 18px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-strong);
            text-transform: none;
            letter-spacing: -0.5px;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            table-layout: fixed;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        th {
            background: #f8fafc;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        th.col-num, td.col-num {
            width: 56px;
            text-align: center;
            color: var(--muted);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            background: #fafbfc;
        }

        tbody tr:hover td.col-num {
            background: #f1f5f9;
        }

        .empty {
            color: #94a3b8;
            font-style: italic;
        }

        @media (max-width: 900px) {
            .layout {
                grid-template-columns: 1fr;
            }

            .main__title {
                font-size: 1.9rem;
            }

            .main__subtitle {
                font-size: 1.1rem;
                margin-bottom: 28px;
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 20px 16px 48px;
            }

            .panel {
                padding: 18px 16px;
            }

            #tableArea {
                padding: 20px 16px;
            }

            .header {
                justify-content: center;
                gap: 0;
            }

            .header__logo {
                display: none;
            }

            .footer {
                flex-direction: column;
                text-align: center;
            }

            .footer__links {
                flex-direction: column;
                flex-wrap: nowrap;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="layout">
            <div class="left-col">
                <div class="panel">
                    <h3>menu.main.tab.export.html.groups</h3>
                    <div id="mainList">

                    </div>
                </div>

                <div class="panel">
                    <h3>menu.main.tab.export.html.elements</h3>
                    <div id="subList">

                    </div>
                </div>
            </div>

            <div class="panel" id="tableArea"></div>
        </div>
    </main>
    <script>
    const data = $DATA$;

    let currentMain = null;
    let currentSub  = null;

    const mainList  = document.getElementById('mainList');
    const subList   = document.getElementById('subList');
    const tableArea = document.getElementById('tableArea');

    function renderMainList() {
        mainList.innerHTML = '';

        Object.entries(data).forEach(([key, section]) => {
            const btn = document.createElement('button');

            btn.className = 'main-tab' + (key === currentMain ? ' active' : '');
            btn.textContent = section.title;
            btn.onclick = () => selectMain(key);

            mainList.appendChild(btn);
        });
    }

    function selectMain(key) {
        currentMain = key;

        const keys = Object.keys(data[key].items);
        currentSub = keys.length ? keys[0] : null;

        renderMainList();
        renderSubList();
        renderTable();
    }

    function renderSubList() {
        subList.innerHTML = '';

        if (!currentMain){
            return;
        }

        Object.keys(data[currentMain].items).forEach((key) => {
            const item = data[currentMain].items[key];
            const btn = document.createElement('button');

            btn.className = 'sub-item' + (key === currentSub ? ' active' : '');
            btn.innerHTML = `<span>${item.title}</span>`;
            btn.onclick = () => selectSub(key);

            subList.appendChild(btn);
        });
    }

    function selectSub(key) {
      currentSub = key;

      renderSubList();
      renderTable();
    }

    function renderTable() {
        if (!currentMain) {
            tableArea.innerHTML = '<p class="empty">No data</p>';

            return;
        }

        if (!currentSub) {
            tableArea.innerHTML = `<h3>${data[currentMain].title}</h3><p class="empty">No elements in this group</p>`;

            return;
        }

        const item = data[currentMain].items[currentSub];

        let html = `<h3>${item.title}</h3><div class="table-wrap"><table><thead><tr>`;
        html += `<th class="col-num">№</th>`;

        item.headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';

        item.rows.forEach((row, i) => {
            html += '<tr>';
            html += `<td class="col-num">${(i % $MAX$) + 1}</td>`;
            row.forEach(c => html += `<td>${c}</td>`);
            html += '</tr>';
        });

        html += '</tbody></table></div>';

        tableArea.innerHTML = html;
    }

    const firstMain = Object.keys(data)[0];

    if (firstMain) {
        selectMain(firstMain);
    }
    </script>
</body>
</html>
